vcf_dir:
  class: Directory
  path: data/releases/GRCh37/2024.2/vcf/togovar
vcf_include_pattern: .vcf.gz$
vcf_exclude_files: 
  - class: File
    path: data/releases/GRCh37/2024.2/vcf/togovar/togovar.all.vcf.gz
    format: http://edamontology.org/format_3016 # VCF

split_variants_per_file: 100000

suffix_length: 4

vcf_header_file:
  class: File
  location: data/original/grch37/vep/vcf_header/vcf_header_line.vcf

query_format: "%CHROM\t%POS\t%ID\t%REF\t%ALT\n"

